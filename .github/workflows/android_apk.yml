name: Android APK

# Builds an installable APK for every pushed branch and uploads it as a workflow artifact.
# Without the ANDROID_STORE_FILE_BASE64 secret the release build is signed with the debug key.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.md"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # vcpkg binary cache on GitHub Packages
  packages: write

env:
  VCPKG_ROOT: "${{github.workspace}}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            echo $mo_file
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Run unit tests
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          cd ./src/android
          ./gradlew :app:testReleaseUnitTest

      - name: Setup vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build APK
        env:
          ANDROID_STORE_FILE_BASE64: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64

          cd ./src/android

          if [[ -n "$ANDROID_STORE_FILE_BASE64" ]]; then
            base64 --decode <<< "${ANDROID_STORE_FILE_BASE64}" > store.jks
            export ANDROID_STORE_FILE=$(pwd)/store.jks
            echo "Android signing store file has been set up."
          else
            echo "No Android signing store file provided. The APK is signed with the debug key."
          fi

          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: cemu-android-${{ github.sha }}
          path: ./src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
